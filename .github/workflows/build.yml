name: Build iOS dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode.app

    - name: Automatically Find and Build Project
      run: |
        echo "Proje dosyası aranıyor..."
        PROJECT_FILE=$(find . -name "*.xcodeproj" -maxdepth 2 | head -n 1)
        
        if [ -z "$PROJECT_FILE" ]; then
          echo "Hata: Repoda hiçbir .xcodeproj dosyası bulunamadı!"
          exit 1
        fi
        
        echo "Bulunan proje: $PROJECT_FILE"
        PROJECT_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
        echo "Şema Adı: $PROJECT_NAME"
        
        # Bulunan dosya ve şema adı ile derleme işlemi
        xcodebuild -project "$PROJECT_FILE" \
                   -scheme "$PROJECT_NAME" \
                   -sdk iphoneos \
                   -configuration Release \
                   clean build \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO
      
    - name: Locate and Upload dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiled-dylib
        path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphoneos/*.dylib
