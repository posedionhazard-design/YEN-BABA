name: Build iOS dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode.app

    - name: Auto Detect Scheme and Build
      run: |
        echo "Proje dosyası aranıyor..."
        PROJECT_FILE=$(find . -name "*.xcodeproj" -maxdepth 2 | head -n 1)
        
        if [ -z "$PROJECT_FILE" ]; then
          echo "Hata: Repoda .xcodeproj bulunamadı!"
          exit 1
        fi
        
        echo "Bulunan proje: $PROJECT_FILE"
        
        # Projenin içindeki geçerli şemaları (schemes) listele ve ilkini seç
        SCHEME_NAME=$(xcodebuild -project "$PROJECT_FILE" -list | grep -A 20 "Schemes:" | tail -n +2 | head -n 1 | xargs)
        
        if [ -z "$SCHEME_NAME" ]; then
          # Eğer otomatik şema bulunamazsa proje dosyasının adını şema yap
          SCHEME_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
        fi
        
        echo "Kullanılacak Şema Adı: $SCHEME_NAME"
        
        # Derleme işlemi
        xcodebuild -project "$PROJECT_FILE" \
                   -scheme "$SCHEME_NAME" \
                   -sdk iphoneos \
                   -configuration Release \
                   clean build \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO
      
    - name: Locate and Upload dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiled-dylib
        path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphoneos/*.dylib
