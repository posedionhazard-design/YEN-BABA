name: Build iOS dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode.app

    - name: Clean and Build Dynamic Library
      run: |
        echo "Starting build process for KvaraBB..."
        
        # Proje dosyasının varlığını doğrulama
        if [ ! -d "KvaraBB" ]; then
          echo "Error: KvaraBB directory not found!"
          exit 1
        fi

        # Xcodebuild ile projenin tüm dosyalarını ve alt klasörlerini derleme
        # Sadece iphoneos değil, simülatör veya genel mimari çakışmalarını önlemek için Release konfigürasyonu uygulanır
        xcodebuild -project "KvaraBB/KvaraBB.xcodeproj" \
                   -scheme "KvaraBB" \
                   -sdk iphoneos \
                   -configuration Release \
                   clean build \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO
      
    - name: Locate and Upload dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiled-dylib
        path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphoneos/*.dylib
